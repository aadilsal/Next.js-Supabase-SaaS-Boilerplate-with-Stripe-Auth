<!--
  Sign-up confirmation email (Supabase Auth).
  Rebrand: change "Acme" and #4f46e5 to match src/config/site.ts.
  Production: paste into Supabase Dashboard -> Authentication -> Emails -> Confirm signup.
-->
<div style="background:#f6f7f9;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
    <p style="font-size:20px;font-weight:700;color:#4f46e5;margin:0 0 24px">Acme</p>
    <h1 style="font-size:22px;font-weight:600;color:#111827;margin:0 0 16px">Confirm your email</h1>
    <p style="font-size:15px;line-height:24px;color:#374151;margin:0 0 24px">
      Thanks for signing up! Click the button below to confirm your email address and finish creating your account.
    </p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display:inline-block;background:#4f46e5;color:#ffffff;font-size:15px;font-weight:600;padding:12px 20px;border-radius:8px;text-decoration:none">
      Confirm email
    </a>
    <p style="font-size:13px;line-height:20px;color:#6b7280;margin:24px 0 0">
      If you didn't create an account, you can safely ignore this email.
    </p>
  </div>
</div>
